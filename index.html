<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fast Media Downloader & Extractor</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
        }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }
        .container {
            max-width: 650px;
            width: 100%;
            text-align: center;
        }
        h1 {
            font-size: 2.2rem;
            margin-bottom: 10px;
            color: #38bdf8;
        }
        p.subtitle {
            color: #94a3b8;
            margin-bottom: 30px;
            font-size: 0.95rem;
        }
        .search-box {
            display: flex;
            gap: 10px;
            background: #1e293b;
            padding: 8px;
            border-radius: 12px;
            border: 1px solid #334155;
        }
        input[type="text"] {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            padding: 12px 16px;
            color: #fff;
            font-size: 1rem;
        }
        button {
            background: #0284c7;
            color: #fff;
            border: none;
            padding: 12px 24px;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            transition: background 0.2s;
        }
        button:hover {
            background: #0369a1;
        }
        .result-card {
            display: none;
            margin-top: 30px;
            background: #1e293b;
            padding: 20px;
            border-radius: 12px;
            border: 1px solid #334155;
            text-align: left;
        }
        .result-card img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 15px;
        }
        .result-card h3 {
            font-size: 1.1rem;
            margin-bottom: 15px;
            color: #f1f5f9;
        }
        .download-btn {
            display: inline-block;
            width: 100%;
            text-align: center;
            background: #10b981;
            color: #fff;
            text-decoration: none;
            padding: 12px;
            border-radius: 8px;
            font-weight: 600;
        }
        .download-btn:hover {
            background: #059669;
        }
        .loader {
            display: none;
            margin-top: 20px;
            color: #38bdf8;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Media Extractor</h1>
    <p class="subtitle">Extract direct video links quickly and easily</p>

    <div class="search-box">
        <input type="text" id="videoUrl" placeholder="Paste link here (YouTube, TikTok, Twitter)...">
        <button onclick="extractMedia()">Extract</button>
    </div>

    <div class="loader" id="loader">Processing, please wait...</div>

    <div class="result-card" id="resultCard">
        <img id="thumb" src="" alt="Thumbnail">
        <h3 id="videoTitle"></h3>
        <a id="downloadLink" class="download-btn" href="" target="_blank">Download Media</a>
    </div>
</div>

<script>
    async function extractMedia() {
        const urlInput = document.getElementById('videoUrl').value;
        const loader = document.getElementById('loader');
        const resultCard = document.getElementById('resultCard');

        if (!urlInput) {
            alert('Please paste a video URL first.');
            return;
        }

        loader.style.display = 'block';
        resultCard.style.display = 'none';

        try {
            const response = await fetch('http://127.0.0.1:8000/api/extract', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ url: urlInput })
            });

            const data = await response.json();
            loader.style.display = 'none';

            if (response.ok) {
                document.getElementById('thumb').src = data.thumbnail;
                document.getElementById('videoTitle').innerText = data.title;
                document.getElementById('downloadLink').href = data.download_url;
                resultCard.style.display = 'block';
            } else {
                alert(data.detail || 'An error occurred.');
            }
        } catch (error) {
            loader.style.display = 'none';
            alert('Could not connect to the server.');
        }
    }
</script>

</body>
</html>
